- name: Prepare APK for Release
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        run: |
          mkdir -p release-apk
          # Ищем любой собранный APK по всей директории проекта и копируем его в папку релиза
          find . -type f -name "*.apk" -not -path "*/release-apk/*" -exec cp {} release-apk/FUTO-Keyboard-Mod.apk \;
          
          # Проверяем, удалось ли скопировать файл
          if [ ! -f release-apk/FUTO-Keyboard-Mod.apk ]; then
            echo "::error::APK файл не найден после сборки!"
            exit 1
          fi

      # 4. Публикуем релиз с готовым APK
      - name: Create GitHub Release
        if: ${{ steps.check_release.outputs.should_build == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.target_tag }}
          name: "FUTO Keyboard ${{ steps.check_release.outputs.upstream_tag }} + Hardware Layouts Fix"
          body: |
            ### Модифицированный релиз FUTO Keyboard ${{ steps.check_release.outputs.upstream_tag }}
            - Добавлена регистрация языковых раскладок для физических клавиатур.
            - Автоматическая синхронизация с официальным апстримом FUTO.
            - Готовый к установке файл `.apk`.
          files: release-apk/FUTO-Keyboard-Mod.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
